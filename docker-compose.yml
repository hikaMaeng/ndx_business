name: ndx-business

services:
  admin:
    build:
      context: .
      dockerfile: apps/admin/docker/Dockerfile
    image: ndx-business-admin:latest
    container_name: admin
    # Reap zombies and forward signals, so stopping the stack is immediate
    # instead of waiting out the kill timeout.
    init: true
    restart: unless-stopped
    env_file:
      # Generated from docker/env.defaults and never committed. The image
      # carries its own defaults, so a missing file is not fatal.
      - path: apps/admin/docker/.env
        required: false
    ports:
      - "${ADMIN_HOST_PORT:-18080}:18080"
    volumes:
      - admin_data:/app/data
    networks:
      - ndx-business_internal
  vibeagent:
    build:
      context: .
      dockerfile: apps/vibeagent/docker/Dockerfile
    image: ndx-business-vibeagent:latest
    container_name: vibeagent
    init: true
    restart: unless-stopped
    env_file:
      - path: apps/vibeagent/docker/.env
        required: false
    environment:
      AGENT_ROLE: gateway
      # Stable in the default single-Gateway deployment. A second Gateway with this
      # identity fails closed; a scaled deployment must assign each replica an ID.
      AGENT_GATEWAY_ID: agent
    labels:
      ndx.business.deploy-health-path: /ready
    depends_on:
      admin:
        condition: service_healthy
    ports:
      - "${AGENT_HOST_PORT:-18081}:18081"
    volumes:
      # Projects root. A host path, not a named volume: the browser runs on the
      # host, so generated files have to be reachable there without docker cp.
      - ${VIBE_WORKSPACE_HOST_DIR:-./workspace}:/workspace
    networks:
      - ndx-business_internal
  vibeagent-worker:
    build:
      context: .
      dockerfile: apps/vibeagent/docker/Dockerfile
    image: ndx-business-vibeagent:latest
    init: true
    restart: unless-stopped
    env_file:
      - path: apps/vibeagent/docker/.env
        required: false
    environment:
      AGENT_ROLE: worker
    depends_on:
      admin:
        condition: service_healthy
    # Internal only: workers never accept client traffic.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Projects root. A host path, not a named volume: the browser runs on the
      # host, so generated files have to be reachable there without docker cp.
      - ${VIBE_WORKSPACE_HOST_DIR:-./workspace}:/workspace
    networks:
      - ndx-business_internal
  vibeagent-gateway-b:
    profiles: [gateway-ha]
    build:
      context: .
      dockerfile: apps/vibeagent/docker/Dockerfile
    image: ndx-business-vibeagent:latest
    init: true
    restart: unless-stopped
    env_file:
      - path: apps/vibeagent/docker/.env
        required: false
    environment:
      AGENT_ROLE: gateway
      AGENT_GATEWAY_ID: agent-b
    labels:
      ndx.business.deploy-health-path: /ready
    depends_on:
      admin:
        condition: service_healthy
    ports:
      - "${AGENT_GATEWAY_B_HOST_PORT:-18082}:18081"
    networks:
      - ndx-business_internal
  vibeagent-router:
    build:
      context: .
      dockerfile: apps/vibeagent/docker/Dockerfile
    image: ndx-business-vibeagent:latest
    init: true
    restart: unless-stopped
    env_file:
      - path: apps/vibeagent/docker/.env
        required: false
    environment:
      AGENT_ROLE: router
    depends_on:
      admin:
        condition: service_healthy
    # Internal only: router fans results into Gateway-specific PGMQ queues.
    networks:
      - ndx-business_internal

volumes:
  admin_data:
    name: ndx-business_admin_data

networks:
  # Project-scoped: no other compose project joins this network. Publishing a
  # port to the host is how the outside reaches the service.
  ndx-business_internal:
    internal: false
