name: ndx-business

services:
  # The database for the `agent` app, kept separate from admin's own so the two
  # apps cannot collide on identically named tables. PGMQ's official image is
  # used directly: this service used to name a Dockerfile that was never
  # committed, so the stack could not be built from a clean checkout.
  postgres:
    # A checkpoint on the host bind mount takes longer than docker's ten second
    # default, and a database killed part-way through one has to recover on the
    # next start. This is the time to shut down cleanly, not a timeout to hit.
    stop_grace_period: 60s
    image: ghcr.io/pgmq/pg18-pgmq:v1.10.0
    # The agent app opens roughly ninety connections at its configured ingress
    # and outbox concurrency, which leaves nothing under the default hundred —
    # not even a psql session to look at it with.
    command: ["postgres", "-c", "max_connections=200"]
    container_name: postgres
    # The official PostgreSQL entrypoint must start as root to repair/check
    # named-volume permissions before dropping to the postgres server user.
    user: "0:0"
    init: true
    restart: unless-stopped
    environment:
      POSTGRES_DB: ndx_business
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data
    # Deliberately not published. Nothing on the host talks to it — the `agent`
    # service reaches it over the internal network, and `docker exec postgres
    # psql` is enough to inspect it. Publishing would also make the deploy
    # script probe it over HTTP, which a database cannot answer.
    volumes:
      - ${NDX_DATA_HOST_DIR:-${VIBE_WORKSPACE_HOST_DIR:-./workspace}}/.ndx/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ndx_business"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ndx-business_internal
  agent:
    build:
      context: .
      dockerfile: apps/agent/docker/Dockerfile
    image: ndx-business-agent:latest
    container_name: agent
    init: true
    restart: unless-stopped
    env_file:
      - path: apps/agent/docker/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AGENT_HOST_PORT:-18083}:18081"
    networks:
      - ndx-business_internal
  admin:
    # A checkpoint on the host bind mount takes longer than docker's ten second
    # default, and a database killed part-way through one has to recover on the
    # next start. This is the time to shut down cleanly, not a timeout to hit.
    stop_grace_period: 60s
    build:
      context: .
      dockerfile: apps/admin/docker/Dockerfile
    image: ndx-business-admin:latest
    container_name: admin
    # Reap zombies and forward signals, so stopping the stack is immediate
    # instead of waiting out the kill timeout.
    init: true
    restart: unless-stopped
    env_file:
      # Generated from docker/env.defaults and never committed. The image
      # carries its own defaults, so a missing file is not fatal.
      - path: apps/admin/docker/.env
        required: false
    ports:
      - "${ADMIN_HOST_PORT:-18080}:18080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${NDX_DATA_HOST_DIR:-${VIBE_WORKSPACE_HOST_DIR:-./workspace}}/.ndx/admin/data:/app/data
      # The database Admin serves — accounts, the fact log, every session the
      # coding agent has ever run. It was on an *anonymous* volume until now:
      # declared by the base postgres image, named by nobody, mentioned in no
      # compose file. A `down` followed by an `up` hands the container a new
      # empty one, so the entire history was one command away from gone.
      - ${NDX_DATA_HOST_DIR:-${VIBE_WORKSPACE_HOST_DIR:-./workspace}}/.ndx/admin/postgres:/var/lib/postgresql
    networks:
      - ndx-business_internal
  vibeagent:
    build:
      context: .
      dockerfile: apps/vibeagent/docker/Dockerfile
    image: ndx-business-vibeagent:latest
    container_name: vibeagent
    init: true
    restart: unless-stopped
    env_file:
      - path: apps/vibeagent/docker/.env
        required: false
    environment:
      AGENT_ROLE: gateway
      # A log label, nothing more. Brokers hold no durable state and nothing routes
      # to them by name, so replicas may share it without failing closed.
      AGENT_GATEWAY_ID: agent
    labels:
      ndx.business.deploy-health-path: /ready
    depends_on:
      admin:
        condition: service_healthy
    ports:
      # Its own variable, not the agent app's. They used to share one, which
      # meant both published 18081 and the stack could not start with both.
      - "${VIBEAGENT_HOST_PORT:-18081}:18081"
    volumes:
      # Projects root. A host path, not a named volume: the browser runs on the
      # host, so generated files have to be reachable there without docker cp.
      - ${NDX_DATA_HOST_DIR:-${VIBE_WORKSPACE_HOST_DIR:-./workspace}}:/workspace
      # ...and `.ndx` masked back out of it. System storage lives inside this
      # root so there is one folder to copy or back up, but the agent runs a
      # real shell in here and `rm -rf` does not consult the folder listing
      # that hides dot-directories. An empty tmpfs over the path means the
      # agent cannot reach the database files at all.
      - type: tmpfs
        target: /workspace/.ndx
    networks:
      - ndx-business_internal
  vibeagent-worker:
    build:
      context: .
      dockerfile: apps/vibeagent/docker/Dockerfile
    image: ndx-business-vibeagent:latest
    init: true
    restart: unless-stopped
    env_file:
      - path: apps/vibeagent/docker/.env
        required: false
    environment:
      AGENT_ROLE: worker
    depends_on:
      admin:
        condition: service_healthy
    # Internal only: workers never accept client traffic.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Projects root. A host path, not a named volume: the browser runs on the
      # host, so generated files have to be reachable there without docker cp.
      - ${NDX_DATA_HOST_DIR:-${VIBE_WORKSPACE_HOST_DIR:-./workspace}}:/workspace
      # ...and `.ndx` masked back out of it. System storage lives inside this
      # root so there is one folder to copy or back up, but the agent runs a
      # real shell in here and `rm -rf` does not consult the folder listing
      # that hides dot-directories. An empty tmpfs over the path means the
      # agent cannot reach the database files at all.
      - type: tmpfs
        target: /workspace/.ndx
    networks:
      - ndx-business_internal
  # Turns recorded facts into work for reactors, per the reaction table.
  # It is the only thing that knows which reaction follows which fact; the
  # workers and the broker read nothing of it.
  vibeagent-dispatcher:
    build:
      context: .
      dockerfile: apps/vibeagent/docker/Dockerfile
    image: ndx-business-vibeagent:latest
    init: true
    restart: unless-stopped
    env_file:
      - path: apps/vibeagent/docker/.env
        required: false
    environment:
      AGENT_ROLE: dispatcher
      # The recovery sweep. It finds facts nothing reacted to — the ones behind
      # the cursor after a restart — and sends them again. The grace period must
      # exceed the longest legitimate reaction, or slow work gets re-driven;
      # that is absorbed by the claim but wastes an inference call. Overridable
      # so a contention test can watch recovery happen without waiting minutes.
      AGENT_RECONCILE_GRACE_SECONDS: ${AGENT_RECONCILE_GRACE_SECONDS:-600}
      AGENT_RECONCILE_MS: ${AGENT_RECONCILE_MS:-60000}
    depends_on:
      admin:
        condition: service_healthy
    networks:
      - ndx-business_internal

  # A second broker, to show they are interchangeable: it claims nothing, is
  # granted nothing, and tails the same log as the first.
  vibeagent-gateway-b:
    profiles: [gateway-ha]
    build:
      context: .
      dockerfile: apps/vibeagent/docker/Dockerfile
    image: ndx-business-vibeagent:latest
    init: true
    restart: unless-stopped
    env_file:
      - path: apps/vibeagent/docker/.env
        required: false
    environment:
      AGENT_ROLE: gateway
      AGENT_GATEWAY_ID: agent-b
    labels:
      ndx.business.deploy-health-path: /ready
    depends_on:
      admin:
        condition: service_healthy
    ports:
      - "${AGENT_GATEWAY_B_HOST_PORT:-18082}:18081"
    volumes:
      - ${NDX_DATA_HOST_DIR:-${VIBE_WORKSPACE_HOST_DIR:-./workspace}}:/workspace
      # ...and `.ndx` masked back out of it. System storage lives inside this
      # root so there is one folder to copy or back up, but the agent runs a
      # real shell in here and `rm -rf` does not consult the folder listing
      # that hides dot-directories. An empty tmpfs over the path means the
      # agent cannot reach the database files at all.
      - type: tmpfs
        target: /workspace/.ndx
    networks:
      - ndx-business_internal

networks:
  # Project-scoped: no other compose project joins this network. Publishing a
  # port to the host is how the outside reaches the service.
  ndx-business_internal:
    internal: false
