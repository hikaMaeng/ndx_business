name: ndx-business

# What every reactor worker shares. They run the same image and the same role;
# what makes each one a different service is the queues it watches and how much
# of the database it is allowed to hold. Splitting further, or collapsing these
# back into one, is a change here and nowhere else — the worker reads its queues
# from the environment.
x-vibe-worker: &vibe-worker
  build:
    context: .
    dockerfile: apps/vibeagent/docker/Dockerfile
  image: ndx-business-vibeagent:latest
  init: true
  restart: unless-stopped
  env_file:
    - path: apps/vibeagent/docker/.env
      required: false
  depends_on:
    admin:
      condition: service_healthy
  # Internal only: no worker accepts client traffic.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - ndx-business_internal

services:
  admin:
    # A checkpoint on the host bind mount takes longer than docker's ten second
    # default, and a database killed part-way through one has to recover on the
    # next start. This is the time to shut down cleanly, not a timeout to hit.
    stop_grace_period: 60s
    build:
      context: .
      dockerfile: apps/admin/docker/Dockerfile
    image: ndx-business-admin:latest
    container_name: admin
    # Reap zombies and forward signals, so stopping the stack is immediate
    # instead of waiting out the kill timeout.
    init: true
    restart: unless-stopped
    env_file:
      # Generated from docker/env.defaults and never committed. The image
      # carries its own defaults, so a missing file is not fatal.
      - path: apps/admin/docker/.env
        required: false
    ports:
      - "${ADMIN_HOST_PORT:-18080}:18080"
      # The product database. Published so the test suite and psql can reach it
      # from the host; nothing in the stack uses this port, the services talk
      # over the internal network.
      - "${ADMIN_POSTGRES_HOST_PORT:-15432}:5432"
    # Nothing to depend on any more. This used to wait for a `postgres` service
    # it never spoke to — admin runs its own on 127.0.0.1, and that service
    # existed only for the retired `agent` app.
    volumes:
      # The one store: accounts, organisations, projects, the fact log, the
      # queues, and every session the coding agent has ever run. It was on an
      # anonymous volume the base image declared and nothing named, so a `down`
      # followed by an `up` handed the container a fresh empty one.
      - ${NDX_DATA_HOST_DIR:-${VIBE_WORKSPACE_HOST_DIR:-./workspace}}/.ndx/admin/postgres:/var/lib/postgresql
    networks:
      - ndx-business_internal
  vibeagent:
    build:
      context: .
      dockerfile: apps/vibeagent/docker/Dockerfile
    image: ndx-business-vibeagent:latest
    container_name: vibeagent
    init: true
    restart: unless-stopped
    env_file:
      - path: apps/vibeagent/docker/.env
        required: false
    environment:
      AGENT_ROLE: broker
      # One database serves every service, and each process holds three pools
      # (runtime, queue, and the reactors' own). Stated here so the total is
      # arithmetic rather than a surprise.
      AGENT_DATABASE_POOL_MAX: 8
      # A log label, nothing more. Brokers hold no durable state and nothing routes
      # to them by name, so replicas may share it without failing closed.
      AGENT_GATEWAY_ID: agent
    labels:
      ndx.business.deploy-health-path: /ready
    depends_on:
      admin:
        condition: service_healthy
    ports:
      # Its own variable, not the agent app's. They used to share one, which
      # meant both published 18081 and the stack could not start with both.
      - "${VIBEAGENT_HOST_PORT:-18081}:18081"
    volumes:
      # Projects root. A host path, not a named volume: the browser runs on the
      # host, so generated files have to be reachable there without docker cp.
      - ${NDX_DATA_HOST_DIR:-${VIBE_WORKSPACE_HOST_DIR:-./workspace}}:/workspace
      # ...and `.ndx` masked back out of it. System storage lives inside this
      # root so there is one folder to copy or back up, but the agent runs a
      # real shell in here and `rm -rf` does not consult the folder listing
      # that hides dot-directories. An empty tmpfs over the path means the
      # agent cannot reach the database files at all.
      - type: tmpfs
        target: /workspace/.ndx
    networks:
      - ndx-business_internal
  # --- reactor workers -------------------------------------------------------
  #
  # One process per kind of work, named for the work. The lines are drawn by
  # what the work costs and what it is allowed to touch, not by tidiness:
  #
  #   inference   seconds to minutes per message, and the only one that costs
  #               money. This is the one worth running more of.
  #   tool        the only one that executes commands nobody vetted, and so the
  #               only one given a writable projects folder.
  #   turn        opening a session, deciding reply-or-tools, waiting for
  #               parallel tools to land. Milliseconds, database only.
  #   read-model  folds the log into the two tables the transcript is read from,
  #               so reopening a session does not replay 66,000 facts. Emits
  #               nothing and takes no session lock, so if it falls behind the
  #               screen lags and the turn does not.
  #
  # The name leads with `worker` because that is the character: which server it
  # is matters before which job it took. The image column already says these are
  # vibeagent, and the `-N` suffix is the replica number — these are the pieces
  # meant to be scaled, so none of them takes a fixed container_name.

  # Calls the model. The slow, expensive step; scale this one first.
  worker-inference:
    <<: *vibe-worker
    environment:
      AGENT_ROLE: worker
      AGENT_QUEUES: vibe_model
      AGENT_DATABASE_POOL_MAX: 8

  # Runs the agent's shell commands inside a project folder. The only container
  # that executes untrusted input, and the only worker given the projects root.
  worker-tool:
    <<: *vibe-worker
    environment:
      AGENT_ROLE: worker
      AGENT_QUEUES: vibe_tool
      AGENT_DATABASE_POOL_MAX: 8
    volumes:
      # Projects root. A host path, not a named volume: the browser runs on the
      # host, so generated files have to be reachable there without docker cp.
      - ${NDX_DATA_HOST_DIR:-${VIBE_WORKSPACE_HOST_DIR:-./workspace}}:/workspace
      # ...and `.ndx` masked back out of it. System storage lives inside this
      # root so there is one folder to copy or back up, but this container runs
      # a real shell in there and `rm -rf` does not consult the folder listing
      # that hides dot-directories. An empty tmpfs over the path means the
      # agent cannot reach the database files at all.
      - type: tmpfs
        target: /workspace/.ndx

  # The turn's decision points: open it, choose what follows a model reply, and
  # wait for parallel tool calls to all report in.
  worker-turn:
    <<: *vibe-worker
    environment:
      AGENT_ROLE: worker
      AGENT_QUEUES: vibe_intake,vibe_decide,vibe_join
      AGENT_DATABASE_POOL_MAX: 4

  # Folds the fact log into the shape the transcript reads.
  worker-read-model:
    <<: *vibe-worker
    environment:
      AGENT_ROLE: worker
      AGENT_QUEUES: vibe_view
      AGENT_DATABASE_POOL_MAX: 4

  vibeagent-b:
    profiles: [gateway-ha]
    build:
      context: .
      dockerfile: apps/vibeagent/docker/Dockerfile
    image: ndx-business-vibeagent:latest
    init: true
    restart: unless-stopped
    env_file:
      - path: apps/vibeagent/docker/.env
        required: false
    environment:
      AGENT_ROLE: broker
      AGENT_GATEWAY_ID: agent-b
    labels:
      ndx.business.deploy-health-path: /ready
    depends_on:
      admin:
        condition: service_healthy
    ports:
      - "${AGENT_GATEWAY_B_HOST_PORT:-18082}:18081"
    volumes:
      - ${NDX_DATA_HOST_DIR:-${VIBE_WORKSPACE_HOST_DIR:-./workspace}}:/workspace
      # ...and `.ndx` masked back out of it. System storage lives inside this
      # root so there is one folder to copy or back up, but the agent runs a
      # real shell in here and `rm -rf` does not consult the folder listing
      # that hides dot-directories. An empty tmpfs over the path means the
      # agent cannot reach the database files at all.
      - type: tmpfs
        target: /workspace/.ndx
    networks:
      - ndx-business_internal

networks:
  # Project-scoped: no other compose project joins this network. Publishing a
  # port to the host is how the outside reaches the service.
  ndx-business_internal:
    internal: false
